<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>ONE CAFE · اتصال قطع است</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { display: grid; place-items: center; padding: 24px; background: #0a0a0b; color: #f5f2ec; font-family: system-ui, sans-serif; text-align: center; }
      main { max-width: 360px; }
      img { width: 92px; height: 92px; border-radius: 24px; }
      h1 { margin: 25px 0 10px; font-size: 23px; }
      p { color: #b9afa8; line-height: 2; }
      button { margin-top: 20px; padding: 12px 28px; border: 0; border-radius: 13px; background: #ff4f1a; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/one-cafe-icon.png" alt="" />
      <h1>اتصال برقرار نیست</h1>
      <p>برای دیدن اطلاعات تازهٔ کافه به اینترنت نیاز است. وقتی اتصال برگشت، دوباره تلاش کن.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
